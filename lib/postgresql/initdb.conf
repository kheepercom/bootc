# Initialize the cluster on first boot. The builtin locale provider keeps
# indexes valid across glibc updates.
[Service]
ExecStartPre=
ExecStartPre=/bin/sh -c 'test -f ${PGDATA}/PG_VERSION || /usr/bin/initdb -D ${PGDATA} --auth-local=peer --auth-host=scram-sha-256 --locale-provider=builtin --locale=C.UTF-8 --encoding=UTF8'
ExecStartPre=/usr/libexec/postgresql-check-db-dir %N
