# Initialize the cluster on first boot and read config from /etc/postgresql.
# The builtin locale provider keeps indexes valid across glibc updates.
[Service]
ExecStartPre=
ExecStartPre=/bin/sh -c 'test -f ${PGDATA}/PG_VERSION || /usr/pgsql-18/bin/initdb -D ${PGDATA} --auth-local=peer --auth-host=scram-sha-256 --locale-provider=builtin --locale=C.UTF-8 --encoding=UTF8'
ExecStartPre=/usr/pgsql-18/bin/postgresql-18-check-db-dir ${PGDATA}
ExecStart=
ExecStart=/usr/pgsql-18/bin/postgres -D ${PGDATA} -c config_file=/etc/postgresql/postgresql.conf
