name: update

# Bumps pinned upstream releases on main an hour before public's bootc.yml
# rebuilds, which only promotes after QA passes.
on:
  schedule:
    - cron: '48 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          .github/update
          git push
